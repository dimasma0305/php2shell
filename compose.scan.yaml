services:
  php-cve-wp-db:
    image: mariadb@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: wplab1
      MARIADB_ROOT_PASSWORD: root-lab-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./lab/8.4.26/wordpress/src/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  wordpress:
    build: ./lab/8.4.26/wordpress
    depends_on:
      php-cve-wp-db:
        condition: service_healthy
    ports: ["127.0.0.1:18173:80"]

  mediawiki:
    build: ./lab/8.4.26/mediawiki
    ports: ["127.0.0.1:18081:80"]

  dokuwiki:
    build: ./lab/8.4.26/dokuwiki
    ports: ["127.0.0.1:18083:80"]

  joomla:
    build: ./lab/8.4.26/joomla
    ports: ["127.0.0.1:18086:80"]

  php-apache:
    build: ./lab/8.4.26/php-apache
    ports: ["127.0.0.1:18082:80"]

  codeigniter:
    build: ./lab/8.4.26/codeigniter
    ports: ["127.0.0.1:18087:80"]
