  location: ingress
  source: EVE alert and HTTP events on the PHP Apache container eth0
  transport: plaintext HTTP after TLS termination
  required_fields: [flow_id, src_ip, dest_ip, http.http_method, http.url]
selection:
  method: POST
  content_type: multipart/form-data with boundary S repeated 17 times
  request_body: PHP_SESSION_UPLOAD_PROGRESS
  signature_id: 9000618
  rule: ../rules/suricata/php-upload-progress-producer.rules
severity: medium
reason: A published exploit producer shape was observed; impact needs separate proof.
known_overlap: A live benign upload with the exact 17-S boundary and upload-progress field alerted with zero reported packet loss (php-benign-fixed-boundary-replay-20261025); this rule cannot infer intent.
known_misses: Changed boundary, encrypted traffic before the sensor, packet loss, alternative exploit chains.
deployment: Alert-only test; do not block based on this experimental rule.
