# Lab-only Apache telemetry for the startup-OOM worker-sequence analytic.
# Mount into /etc/apache2/conf-enabled/ before Apache starts. This redefines
# the stock vhost's `combined` format to expose worker and connection sequence.
LogFormat "%h port=%{remote}p %t \"%r\" %>s %b worker=%P keepalive=%k" combined
php_admin_flag log_errors On
php_admin_value error_log /proc/self/fd/2
