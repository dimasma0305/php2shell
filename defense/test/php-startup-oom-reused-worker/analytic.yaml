id: php-startup-oom-reused-worker
artifact_type: lab_reference
owner: dimasma0305
status: experimental
claim: attempted_trigger
finding: CVE-2026-109618 startup-OOM candidate; CVE-2026-109619 producer context
sensor:
  location: runtime
  source: Docker timestamped Apache access and PHP error logs with php-worker-audit.conf
  required_fields: [event_id, worker_pid, client, kind, timestamp]
backend:
  tested_reference_evaluator: irai/.agents/skills/soc-detection-engineering/scripts/php_worker_sequence.py
  evaluator_revision: 5bf859e7cfbc6dcb946d012c8dc61e0a6bd9cfda
  collector_configuration: collector.conf
selection:
  producer: PHP Fatal error for Allowed memory size in Unknown on line 0
  producer_access: POST on the same worker PID and client socket; access completion within 30 seconds after the error
  continuation: a later request on that same worker and socket with a greater Apache keepalive counter, within 30 seconds
  correlation_key: [worker_pid, client_address, client_port]
severity: medium
reason: A pre-application OOM was followed by worker reuse on the same connection.
known_overlap: A benign large or malformed upload can also cause a startup OOM; this event does not prove a dangling pointer or attacker intent.
known_misses: Other OOM sources, non-OOM stale-state producers, a later request on another connection, FPM, disabled PHP error logs, and changed Apache log format.
deployment: Lab reference evaluator only; do not label this rule as memory corruption or RCE.
